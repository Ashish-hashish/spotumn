name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Configure APT for ARM64 & Install Dependencies
        run: |
          # 1. Enable ARM64 architecture
          sudo dpkg --add-architecture arm64

          # 2. Restrict default Ubuntu repositories to amd64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list

          # 3. Add Ubuntu Ports repository for arm64 (Jammy release for 22.04)
          sudo bash -c 'cat <<EOF > /etc/apt/sources.list.d/arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          EOF'

          # 4. Update index and install cross-dependencies
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libasound2-dev libasound2-dev:arm64 \
            libogg-dev libogg-dev:arm64 \
            libvorbis-dev libvorbis-dev:arm64 \
            libflac-dev libflac-dev:arm64 \
            libmpg123-dev libmpg123-dev:arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
