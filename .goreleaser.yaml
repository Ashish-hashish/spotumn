version: 2
project_name: spotumn

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/spotumn
    targets:
      - linux_amd64
      - linux_arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=gcc
          - CXX=g++
          - PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig
          - CGO_LDFLAGS=/usr/lib/x86_64-linux-gnu/libFLAC.a /usr/lib/x86_64-linux-gnu/libvorbis.a /usr/lib/x86_64-linux-gnu/libvorbisenc.a /usr/lib/x86_64-linux-gnu/libogg.a -lm
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
          - PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          - CGO_LDFLAGS=/usr/lib/aarch64-linux-gnu/libFLAC.a /usr/lib/aarch64-linux-gnu/libvorbis.a /usr/lib/aarch64-linux-gnu/libvorbisenc.a /usr/lib/aarch64-linux-gnu/libogg.a -lm

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

