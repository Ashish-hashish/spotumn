version: 2
project_name: spotumn

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/spotumn
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}
      - CXX={{ if eq .Arch "arm64" }}aarch64-linux-gnu-g++{{ else }}g++{{ end }}
      - PKG_CONFIG_PATH={{ if eq .Arch "arm64" }}/usr/lib/aarch64-linux-gnu/pkgconfig{{ else }}/usr/lib/x86_64-linux-gnu/pkgconfig{{ end }}
      # Explicitly pass static .a archives so GCC resolves FLAC/Vorbis/Ogg symbols statically
      - CGO_LDFLAGS={{ if eq .Arch "arm64" }}/usr/lib/aarch64-linux-gnu/libFLAC.a /usr/lib/aarch64-linux-gnu/libvorbis.a /usr/lib/aarch64-linux-gnu/libvorbisenc.a /usr/lib/aarch64-linux-gnu/libogg.a{{ else }}/usr/lib/x86_64-linux-gnu/libFLAC.a /usr/lib/x86_64-linux-gnu/libvorbis.a /usr/lib/x86_64-linux-gnu/libvorbisenc.a /usr/lib/x86_64-linux-gnu/libogg.a{{ end }}
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

cro
